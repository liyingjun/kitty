# Kitty 终端配置文件


# ===== 字体设置 =====
# 使用 Linux 默认终端字体
# 可以尝试以下几个选项之一：
# font_family Monospace
# font_family DejaVu Sans Mono
# font_family Ubuntu Mono
# font_family Liberation Mono
font_family DejaVu Sans Mono

bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 11.0

# 字体特性（v0.26.5 可能不支持某些选项）
disable_ligatures never

# ===== 光标设置 =====
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# ===== 滚动设置 =====
scrollback_lines 10000
wheel_scroll_multiplier 5.0

# ===== 鼠标设置 =====
mouse_hide_wait 3.0
url_color #0087bd
url_style curly
open_url_with default
copy_on_select yes

# ===== 性能调优 =====
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ===== 窗口布局 =====
remember_window_size  yes
initial_window_width  1200
initial_window_height 700
enabled_layouts splits,stack
window_padding_width 4
placement_strategy center

# ===== 标签页设置 =====
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style   bold
inactive_tab_font_style normal

# ===== 主题配色（黑色背景默认主题）=====
# 背景和前景色
foreground #FFFFFF
background #000000
background_opacity 1.0

# 黑色
color0 #000000
color8 #555555

# 红色
color1 #CC0000
color9 #EF2929

# 绿色
color2  #4E9A06
color10 #8AE234

# 黄色
color3  #C4A000
color11 #FCE94F

# 蓝色
color4  #3465A4
color12 #729FCF

# 洋红色
color5  #75507B
color13 #AD7FA8

# 青色
color6  #06989A
color14 #34E2E2

# 白色
color7  #D3D7CF
color15 #EEEEEC

# 选中文本颜色
selection_foreground #FFFFFF
selection_background #4A90D9

# ===== 自定义按键映射 =====
# 清除默认的分屏快捷键
clear_all_shortcuts no

# 横向分屏（左右分屏）- Alt+D
map alt+d launch --location=vsplit --cwd=current

# 竖向分屏（上下分屏）- Alt+Shift+D
map alt+shift+d launch --location=hsplit --cwd=current

# 分屏切换 - 方向性导航
map alt+bracketright neighboring_window right
map alt+bracketleft neighboring_window left
map alt+p neighboring_window up
map alt+n neighboring_window down

# 关闭当前分屏窗口
map alt+w close_window

# 调整分屏大小
map alt+shift+k resize_window taller 3
map alt+shift+j resize_window shorter 3
map alt+shift+h resize_window narrower 3
map alt+shift+l resize_window wider 3

# 标签页管理
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# 其他常用快捷键
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+0 change_font_size all 0

# 滚动
map ctrl+shift+up scroll_line_up
map ctrl+shift+down scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end

# —— 直接跳到第 N 个 Tab（1 起始）——
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# —— 新建 Tab / 新建窗口 ——
# 建议用 launch 带上 --cwd=current，这样在当前目录新建
map alt+t launch --type=tab --cwd=current
map alt+shift+n launch --type=os-window --cwd=current

# 使用alt+v,鼠标右键粘贴
mouse_map right press ungrabbed paste_from_clipboard
map alt+v paste_from_clipboard

# ===== 其他设置 =====
# 允许远程控制（用于脚本控制）
allow_remote_control yes

# Shell 集成
shell_integration enabled

# 确认关闭
confirm_os_window_close 0

# 音频铃声
enable_audio_bell no
visual_bell_duration 0.0

# 剪贴板
clipboard_control write-clipboard write-primary read-clipboard read-primary

# 输入法(auto,ibus,xim)
x11_input_method_module xim
